global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'api-gateway'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['api-gateway:8080', 'host.docker.internal:8080']

  - job_name: 'auth-tenant-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['auth-tenant-service:8081', 'host.docker.internal:8081']

  - job_name: 'product-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['product-service:8082', 'host.docker.internal:8082']

  - job_name: 'async-worker-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['async-worker-service:8083', 'host.docker.internal:8083']

  - job_name: 'config-feature-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['config-feature-service:8084', 'host.docker.internal:8084']

  - job_name: 'order-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['order-service:8085', 'host.docker.internal:8085']

  - job_name: 'customer-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['customer-service:8086', 'host.docker.internal:8086']
